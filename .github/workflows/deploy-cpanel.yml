name: Deploy to cPanel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: cpanel-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Run Quality & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, curl, json
      - name: Setup Database for CI Runner
        run: |
          php -r "file_put_contents('.env', 'DB_CONNECTION=sqlite' . PHP_EOL . 'SQLITE_PATH=database/nyautwa.sqlite' . PHP_EOL);"
          php database/migrate.php
          php database/seed.php
      - name: Verify Line Counts & Integrity
        run: |
          php tests/check_line_counts.php
          php tests/verification_test.php
          php tests/mpwa_features_test.php

  deploy:
    name: Auto Deploy to cPanel (Webhook / FTP)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Instant Git Deploy Webhook
        id: webhook
        continue-on-error: true
        run: |
          SECRET="${{ secrets.DEPLOY_SECRET || 'nyautwa_deploy_secret_994821' }}"
          TARGETS=("${{ secrets.DEPLOY_URL }}" "https://nyautwa.asr-desain.my.id/api/v1/internal/deploy" "https://nyautwa.asr-desain.my.id/public/api/v1/internal/deploy")
          DEPLOYED=false
          for U in "${TARGETS[@]}"; do
            [ -z "$U" ] && continue
            echo "Trigger Webhook ke $U..."
            RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$U" -H "X-Deploy-Token: $SECRET" --data "token=$SECRET" || true)
            echo "$RESP"
            if echo "$RESP" | grep -q "HTTP_STATUS:200"; then
              echo "Deploy Webhook Sukses!"
              DEPLOYED=true
              break
            fi
          done
          $DEPLOYED && exit 0 || exit 1

      - name: Fallback to FTP Deploy
        if: steps.webhook.outcome != 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: ${{ secrets.CPANEL_FTP_TARGET_DIR || 'public_html/' }}
          protocol: ftp
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            **/docs/**
            .env
            .env.example
            database/*.sqlite
            engine/sessions/**
            engine/node_modules/**
            storage/logs/**
            storage/sessions/**
