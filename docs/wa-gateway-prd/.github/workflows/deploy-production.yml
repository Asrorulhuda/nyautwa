name: deploy-production

# Production HANYA dipicu oleh tag vX.Y.Z yang berasal dari main,
# dan harus disetujui manual lewat GitHub Environment "production".
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/${{ github.repository }}/app
  IMAGE_ENGINE: ghcr.io/${{ github.repository }}/engine

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pastikan tag berasal dari main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak berada di branch main. Production dibatalkan."
            exit 1
          fi
      - id: v
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ env.IMAGE_APP }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: engine
          file: docker/engine.Dockerfile
          push: true
          tags: ${{ env.IMAGE_ENGINE }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Job ini berhenti dan menunggu approval reviewer di environment production
    environment:
      name: production
      url: ${{ secrets.APP_URL }}
    steps:
      - name: Deploy dengan backup dan rollback otomatis
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: false
          script: |
            set -u
            cd "${{ secrets.DEPLOY_PATH }}"
            NEW="${{ needs.verify.outputs.version }}"
            PREV="$(cat .current_version 2>/dev/null || echo none)"
            export IMAGE_APP="${{ env.IMAGE_APP }}"
            export IMAGE_ENGINE="${{ env.IMAGE_ENGINE }}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo ">> Backup database"
            ./scripts/backup-db.sh "pre-$NEW" || { echo "Backup gagal, batal"; exit 1; }

            export TAG="$NEW"
            docker compose pull || { echo "Pull gagal, batal"; exit 1; }

            echo ">> Migrasi"
            docker compose run --rm app php bin/migrate.php || { echo "Migrasi gagal, batal"; exit 1; }

            echo ">> Update app dan worker"
            docker compose up -d app worker nginx

            echo ">> Health check"
            ok=0
            for i in $(seq 1 12); do
              if curl -fsS "${{ secrets.APP_URL }}/healthz" > /dev/null; then ok=1; break; fi
              sleep 10
            done

            if [ "$ok" -ne 1 ]; then
              echo ">> GAGAL, rollback ke $PREV"
              if [ "$PREV" != "none" ]; then
                export TAG="$PREV"
                docker compose up -d app worker nginx
              fi
              exit 1
            fi

            echo ">> Update engine (memutus sesi singkat, pulih otomatis)"
            docker compose up -d engine

            echo "$PREV" > .previous_version
            echo "$NEW"  > .current_version
            echo ">> Production sekarang di $NEW"

      - name: Verifikasi akhir
        run: |
          curl -fsS "${{ secrets.APP_URL }}/healthz"
