name: rollback-production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi tujuan, contoh v1.1.0 (kosongkan untuk versi sebelumnya)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production   # tetap butuh approval reviewer
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            TARGET="${{ inputs.version }}"
            [ -z "$TARGET" ] && TARGET="$(cat .previous_version)"
            [ -z "$TARGET" ] || [ "$TARGET" = "none" ] && { echo "Tidak ada versi tujuan"; exit 1; }
            CURRENT="$(cat .current_version)"
            echo "Rollback $CURRENT -> $TARGET"
            export IMAGE_APP="ghcr.io/${{ github.repository }}/app"
            export IMAGE_ENGINE="ghcr.io/${{ github.repository }}/engine"
            export TAG="$TARGET"
            docker compose pull
            docker compose up -d --remove-orphans
            echo "$CURRENT" > .previous_version
            echo "$TARGET"  > .current_version
            sleep 15
            curl -fsS "${{ secrets.APP_URL }}/healthz"
